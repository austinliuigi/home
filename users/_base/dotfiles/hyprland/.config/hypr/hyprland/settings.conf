source = ~/.local/share/hyprland/palette.conf

# Some default env vars
# env = XCURSOR_THEME,WindowsHands
env = XCURSOR_THEME,TxnHands # uses name of folder in ~/.icons
env = XCURSOR_SIZE,24

env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        tap-to-click = false
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 4
    border_size = 2
    no_focus_fallback = true  # don't wrap when changing window focus
    col.active_border = rgba($base0Daa)
    col.inactive_border = rgba($base0100)

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5

    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
        xray = false
    }

    shadow {
      enabled = false
      range = 3
      render_power = 3
      color = rgba(000000cc)
    }

    active_opacity = 0.97
    inactive_opacity = 0.97
    dim_inactive = true
    dim_strength = 0.25
}

animations {
    enabled = true

    # https://wiki.hyprland.org/Configuring/Animations/
    animation = windows, 1, 3, default, slide
    animation = workspaces, 0, 2, default, fade
    animation = layers, 0
    animation = border, 0
    animation = borderangle, 0
    animation = fade, 0
}

cursor {
    inactive_timeout = 0
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = slave
    mfact = 0.5
}

misc {
    disable_hyprland_logo = true
    new_window_takes_over_fullscreen = 2
}

binds {
  focus_preferred_method = 1
  # workspace_center_on = 1
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = tpps/2-ibm-trackpoint
#     enabled = false
#     sensitivity = -1.0
