[colors]
background=@base00@ff
text=@base03@ff            # fg of unselected entries
prompt=@base0A@ff          # fg of prompt characters
placeholder=@base02@ff     # fg of placeholder string
input=@base04@ff           # fg of user input string
match=@base0D@ff           # fg of the matched substring
selection-text=@base04@ff  # fg of selected entry
selection=@base02@ff       # bg of selected entry
selection-match=@base0D@ff # fg of the matched substring of the selected entry
counter=@base04@ff         # fg of the match-count stats
border=@base03@ff
