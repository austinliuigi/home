[colors]
background=@base00@ff
text=@base05@ff            # fg of unselected entries
prompt=@base05@ff          # fg of prompt characters
placeholder=@base02@ff     # fg of placeholder string
input=@base05@ff           # fg of user input string
match=@base0A@ff           # fg of the matched substring
selection-text=@base05@ff  # fg of selected entry
selection=@base02@ff       # bg of selected entry
selection-match=@base0A@ff # fg of the matched substring of the selected entry
counter=@base05@ff         # fg of the match-count stats
border=@base05@ff
