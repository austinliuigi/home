---
default:
  margin:
    percent: 8
  colors:
    foreground: "@base05@"
    background: "@base00@"

slide_title:
  alignment: center
  padding_bottom: 1
  padding_top: 1
  colors:
    foreground: "@base0D@"
  bold: true
  font_size: 2

code:
  alignment: left
  minimum_size: 50
  minimum_margin:
    percent: 8
  # theme_name: base16-eighties.dark
  theme_name: palette
  padding:
    horizontal: 2
    vertical: 1

execution_output:
  colors:
    foreground: "@base05@"
    background: "@base01@"
  status:
    running:
      foreground: "@base0D@"
    success:
      foreground: "@base0B@"
    failure:
      foreground: "@base08@"
    not_started:
      foreground: "@base0A@"
  padding:
    horizontal: 2
    vertical: 1

inline_code:
  colors:
    foreground: "@base0B@"
    # foreground: "@base0F@"
    # background: "@base02@"

intro_slide:
  title:
    alignment: center
    colors:
      foreground: "@base0B@"
    font_size: 2
  subtitle:
    alignment: center
    colors:
      foreground: "@base0D@"
  event:
    alignment: center
    colors:
      foreground: "@base0B@"
  location:
    alignment: center
    colors:
      foreground: "@base0D@"
  date:
    alignment: center
    colors:
      foreground: "@base0A@"
  author:
    alignment: center
    colors:
      foreground: "@base03@"
    positioning: page_bottom
  footer: false

headings:
  h1:
    prefix: "██"
    colors:
      foreground: "@base0D@"
  h2:
    prefix: "▓▓"
    colors:
      foreground: "@base0C@"
  h3:
    prefix: "▒▒▒"
    colors:
      foreground: "@base0A@"
  h4:
    prefix: "░░░░"
    colors:
      foreground: "@base09@"
  h5:
    prefix: "░░░░░"
    colors:
      foreground: "@base0B@"
  h6:
    prefix: "░░░░░░"
    colors:
      foreground: "@base0C@"

block_quote:
  prefix: "▍ "
  colors:
    foreground: "@base05@"
    background: "@base00@"
    prefix: "@base0A@"

alert:
  prefix: "▍ "
  base_colors:
    foreground: "@base05@"
    background: "@base00@"
  styles:
    note:
      color: "@base0D@"
    tip:
      color: "@base0B@"
    important:
      color: "@base0E@"
    warning:
      color: "@base09@"
    caution:
      color: "@base08@"

typst:
  colors:
    foreground: "@base05@"
    background: "@base01@"

footer:
  style: template
  right: "{current_slide} / {total_slides}"

modals:
  selection_colors:
    foreground: "@base0D@"

mermaid:
  background: transparent
  theme: dark

d2:
  theme: 103
