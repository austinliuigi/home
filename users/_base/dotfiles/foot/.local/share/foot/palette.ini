[colors]
alpha=1.0
background=@base00@
foreground=@base05@
flash=@base03@
flash-alpha=0.5

# Normal/regular colors (color palette 0-7)
regular0=@base00@  # black
regular1=@base08@  # red
regular2=@base0B@  # green
regular3=@base0A@  # yellow
regular4=@base0D@  # blue
regular5=@base0E@  # magenta
regular6=@base0C@  # cyan
regular7=@base05@  # white

# Bright colors (color palette 8-15)
bright0=@base03@   # bright black
bright1=@base08@   # bright red
bright2=@base0B@   # bright green
bright3=@base0A@   # bright yellow
bright4=@base0D@   # bright blue
bright5=@base0E@   # bright magenta
bright6=@base0C@   # bright cyan
bright7=@base07@   # bright white

# Dimmed colors (see foot.ini(5) man page)
#   - if not set, foot decreases luminance of current color
# dim0=<not set>
# dim1=<not set>
# dim2=<not set>
# dim3=<not set>
# dim4=<not set>
# dim5=<not set>
# dim6=<not set>
# dim7=<not-set>

# The remaining 256-color palette
# 16 = <256-color palette #16>
# ...
# 255 = <256-color palette #255>

# Sixel colors
# sixel0 =  000000
# sixel1 =  3333cc
# sixel2 =  cc2121
# sixel3 =  33cc33
# sixel4 =  cc33cc
# sixel5 =  33cccc
# sixel6 =  cccc33
# sixel7 =  878787
# sixel8 =  424242
# sixel9 =  545499
# sixel10 = 994242
# sixel11 = 549954
# sixel12 = 995499
# sixel13 = 549999
# sixel14 = 999954
# sixel15 = cccccc

# Misc colors
selection-foreground=@base05@
selection-background=@base02@
jump-labels=@base00@ @base0A@          # black-on-yellow
scrollback-indicator=@base00@ @base0D@ # black-on-bright-blue
search-box-no-match=@base00@ @base08@  # black-on-red
search-box-match=@base00@ @base0A@     # black-on-yellow
urls=@base0D@
